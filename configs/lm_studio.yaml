# LM endpoints — только из этого файла (./up.sh / up.ps1 НЕ перезаписывают).
# Подставьте свои URL LM Studio (OpenAI-compatible /v1).
#
# Docker (Mac/Windows Desktop): часто host.docker.internal:1234
# Linux / host-net: 127.0.0.1:1234
# Другая машина в LAN: http://192.168.x.x:1234/v1
#
# model id: curl http://HOST:1234/v1/models  → поле "id"
#
# Проверка:
#   curl -s http://127.0.0.1:8088/api/v1/lm/pool

endpoints:
  - base_url: http://host.docker.internal:1234/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-primary
    concurrent: 4

health_interval_sec: 10
context_length: 8192
thinking: false
