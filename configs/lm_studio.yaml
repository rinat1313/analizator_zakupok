# Единственный источник списка LM Studio для analizator.
# ./up.sh --ai этот файл НЕ перезаписывает.
#
# На Mac (Docker bridge) — ОДИН URL на один физический LMS:
#   http://10.2.12.111:1234/v1
# Не дублируйте тем же сервером host.docker.internal / 127.0.0.1.
#
# Пример второго сервера (раскомментируйте блок целиком):
# - base_url: http://172.25.16.1:1234/v1
#   api_key: lm-studio
#   model: qwen/qwen3-vl-4b
#   name: lm-win
#   concurrent: 2
#
# Проверка:
#   curl -s http://10.2.12.111:1234/v1/models | head
#   curl -s http://127.0.0.1:8088/api/v1/lm/pool

endpoints:
  - base_url: http://10.2.12.111:1234/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-mac
    concurrent: 4

health_interval_sec: 10
context_length: 8192
thinking: false
