# Список доступных LM Studio (OpenAI-compatible /v1).
# Анализатор проверяет доступность и параллелит AI по числу живых слотов
# (не больше ~90% CPU хоста).
#
# Источник IP/портов: zakupki-platform/configs/lm_studio_pool.conf
# Перегенерация: ./up.sh --ai → scripts/lm-studio-start-pool.sh
#
# Модель: qwen/qwen3-8b, context 8192, thinking выключен в клиенте
# (enable_thinking=false + /no_think) и через model.yaml при старте пула.
#
# Локальные 127.0.0.1 в conf → host.docker.internal для контейнера analizator.
# concurrent: N — несколько слотов на один сервер (lms load --parallel N).

endpoints:
  - base_url: http://host.docker.internal:1234/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-1
  - base_url: http://host.docker.internal:1235/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-2
  - base_url: http://host.docker.internal:1236/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-3
  - base_url: http://host.docker.internal:1237/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-4

health_interval_sec: 15
context_length: 8192
thinking: false
