# Единственная LM Studio (OpenAI-compatible /v1).
# Режим: single exclusive — max_parallel=1.
#
# Приоритет URL:
#   1) переменная окружения LM_STUDIO_BASE_URL (если задана явно)
#   2) этот файл (первый endpoint)
#
# Локально (go run на хосте):  http://127.0.0.1:1234/v1
# Docker / zakupki-platform:    LM_STUDIO_BASE_URL=http://host.docker.internal:1234/v1
#   (так задано в Dockerfile / Dockerfile.runtime)

endpoints:
  - base_url: http://127.0.0.1:1234/v1
    api_key: lm-studio
    model: local-model
    name: local

health_interval_sec: 15
