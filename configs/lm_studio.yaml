# Автогенерация: scripts/lm-studio-start-pool.sh
# Источник: /agent/repos/zakupki-platform/configs/lm_studio_pool.conf
# Модель qwen/qwen3-8b, context 8192, thinking off (клиент + model.yaml).
# IP/порты: configs/lm_studio_pool.conf → ./up.sh --ai

endpoints:
