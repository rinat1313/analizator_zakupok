# Единственный источник списка LM Studio для analizator.
# ./up.sh --ai этот файл НЕ перезаписывает.
#
# На Mac (Docker bridge):
#   - LMS на этой же машине: 10.2.12.111 ИЛИ host.docker.internal
#   - НЕ используйте 127.0.0.1 в yaml из контейнера без rewrite
#     (rewrite всё же переписывает 127.0.0.1 → host.docker.internal)
#
# Windows LMS добавляйте только если реально отвечает:
#   curl -s http://IP:1234/v1/models
#
# Проверка:
#   curl -s http://10.2.12.111:1234/v1/models | head
#   curl -s http://127.0.0.1:8088/api/v1/lm/pool

endpoints:
  - base_url: http://10.2.12.111:1234/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-mac-111
    concurrent: 4
  - base_url: http://host.docker.internal:1234/v1
    api_key: lm-studio
    model: qwen/qwen3-8b
    name: lm-docker-host
    concurrent: 2

health_interval_sec: 10
context_length: 8192
thinking: false
