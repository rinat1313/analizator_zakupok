id: default
name: Базовый анализ закупки
description: >
  Стандартный чек-лист для оценки извещения и документации:
  предмет, НМЦК, сроки, требования, обеспечение, риски участия.

items:
  - id: subject_fit
    title: Предмет и соответствие профилю
    description: Понятен ли объект закупки и подходит ли он типичному поставщику товаров/работ/услуг.
    prompt: >
      Кратко опиши предмет закупки. Есть ли размытые формулировки, «прочее»,
      смешение несвязанных позиций? Оцени ясность объекта.
    keywords: [предмет, объект, наименование, окпд, ктру, описание, работы, услуги, товар]
    max_chunks: 4
    weight: 1.2

  - id: nmck_and_finance
    title: НМЦК и финансовые условия
    description: Адекватность цены, аванс, порядок оплаты, обеспечение заявки/контракта.
    prompt: >
      Найди НМЦК/цену договора, обеспечение заявки и контракта, сроки оплаты.
      Отметь завышенное обеспечение, долгую отсрочку оплаты, отсутствие формулы цены.
    keywords: [нмцк, цена, стоимость, обеспечение, гарантия, аванс, оплата, руб, ₽]
    max_chunks: 4
    weight: 1.5

  - id: deadlines
    title: Сроки подачи и исполнения
    description: Реалистичность сроков подачи заявок и исполнения обязательств.
    prompt: >
      Извлеки даты: публикация, окончание подачи, аукцион/рассмотрение, срок поставки/работ.
      Оцени, достаточно ли времени на подготовку и исполнение.
    keywords: [срок, дата, подач, окончание, поставк, исполнен, график, период]
    max_chunks: 3
    weight: 1.0

  - id: requirements
    title: Требования к участнику и заявке
    description: Лицензии, опыт, СРО, кадры, документы — законность и выполнимость.
    prompt: >
      Перечисли ключевые требования к участникам и составу заявки.
      Есть ли избыточные/дискриминационные условия, жёсткий опыт «именно с этим заказчиком»?
    keywords: [требован, участник, лиценз, опыт, сро, квалиф, документ, заявка, соответствие]
    max_chunks: 5
    weight: 1.4

  - id: docs_quality
    title: Качество и полнота документации
    description: Есть ли ТЗ, спецификация, проект контракта; согласованы ли они между собой.
    prompt: >
      Оцени комплект документов: извещение, ТЗ, спецификация, проект контракта.
      Есть ли противоречия, отсутствующие приложения, ссылки на несуществующие файлы?
    keywords: [техническ, задание, спецификац, контракт, приложени, документ, инструкц]
    max_chunks: 4
    weight: 1.0

  - id: risks
    title: Риски участия
    description: Штрафы, односторонний отказ, приёмка, ответственность поставщика.
    prompt: >
      Выдели юридические и коммерческие риски: штрафы, пени, односторонний отказ,
      сложная приёмка, субподрядные ограничения. Дай практичные рекомендации.
    keywords: [штраф, пеня, ответственность, отказ, приёмк, приемк, риск, неустойк, расторжен]
    max_chunks: 4
    weight: 1.3
