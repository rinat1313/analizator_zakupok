id: quick
name: Быстрый скрининг
description: Короткий чек-лист для первичной фильтрации тендеров.

items:
  - id: overview
    title: Краткий обзор
    description: Суть закупки и стоит ли смотреть дальше.
    prompt: >
      В 5–8 предложениях опиши закупку: кто заказчик, что покупают, цена, сроки.
      Дай вердикт: смотреть детально / сомнительно / не интересно — с причиной.
    keywords: [предмет, нмцк, заказчик, срок, объект]
    max_chunks: 5
    weight: 1.0

  - id: red_flags
    title: Красные флаги
    description: Явные стоп-факторы в тексте.
    prompt: >
      Найди красные флаги: слишком короткий срок, странные требования, неполная документация,
      обеспечение выше разумного, размытый предмет. Если флагов нет — так и скажи.
    keywords: [обеспечение, срок, требован, лиценз, штраф, опыт]
    max_chunks: 5
    weight: 1.5
