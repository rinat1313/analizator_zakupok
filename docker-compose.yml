# Полный стек: PostgreSQL + analizator_zakupok (+ опционально ZakupkiParser).
#
# Быстрый старт:
#   ./scripts/up.sh
#   ./scripts/parse.sh 1
#
# LM Studio должен быть запущен (Local Server :1234) с загруженной моделью.
# Задайте LM_STUDIO_MODEL в .env (см. .env.example / .env.lan.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakupki
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10

  analizator:
    build: .
    ports:
      - "8088:8088"
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      PROMPTS_DIR: /app/configs/prompts
      DEFAULT_CHECKLIST: ${DEFAULT_CHECKLIST:-default}
      # LAN: http://192.168.x.x:1234/v1  |  same host: http://host.docker.internal:1234/v1
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      LM_STUDIO_TIMEOUT: ${LM_STUDIO_TIMEOUT:-5m}
      CHUNK_SIZE: ${CHUNK_SIZE:-3500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-250}
      MAX_CHUNKS: ${MAX_CHUNKS:-40}
      CONCURRENCY: ${CONCURRENCY:-2}
      DATABASE_URL: ${DATABASE_URL:-postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable}
    volumes:
      # По умолчанию — каталог result из клона ZakupkiParser (.deps), см. scripts/up.sh
      - ${TENDERS_HOST_PATH:-./.deps/ZakupkiParser/DataCode/result}:/data/tenders
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot парсер. Запуск: ./scripts/parse.sh 1
  # Требует предварительного ./scripts/up.sh (клонирует ZakupkiParser в .deps/).
  parser:
    profiles: ["parser"]
    build:
      context: ${PARSER_CONTEXT:-./.deps/ZakupkiParser/DataCode}
      dockerfile: Dockerfile
    environment:
      EIS_INSECURE: "1"
    volumes:
      - ${TENDERS_HOST_PATH:-./.deps/ZakupkiParser/DataCode/result}:/app/result
      - ${PARSER_DATA_PATH:-./.deps/ZakupkiParser/DataCode/data}:/app/data:ro
    depends_on:
      - analizator
    entrypoint: ["/app/parser"]
    command:
      - "-result"
      - "/app/result"
      - "-analyze-url"
      - "http://analizator:8088"

volumes:
  pgdata:
