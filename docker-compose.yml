# Автономный запуск analizator_zakupok.
#
# По умолчанию LM Studio на локальной машине: http://127.0.0.1:1234/v1
# (сервис в Docker идёт в host-network, чтобы достучаться до localhost хоста).
#
# LM Studio в локальной сети (другой ПК):
#   export LM_STUDIO_BASE_URL=http://192.168.1.50:1234/v1
#   export LM_STUDIO_MODEL=<id модели из LM Studio>
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakupki
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["db"]

  analizator:
    build: .
    # host network: 127.0.0.1:1234 = LM Studio на этой же машине; API на :8088 хоста
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      PROMPTS_DIR: /app/configs/prompts
      DEFAULT_CHECKLIST: ${DEFAULT_CHECKLIST:-default}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://127.0.0.1:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      LM_STUDIO_TIMEOUT: ${LM_STUDIO_TIMEOUT:-5m}
      CHUNK_SIZE: ${CHUNK_SIZE:-3500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-250}
      MAX_CHUNKS: ${MAX_CHUNKS:-40}
      CONCURRENCY: ${CONCURRENCY:-1}
      # Раскомментируйте вместе с profile db (тогда уберите network_mode: host):
      # DATABASE_URL: postgres://zakupki:zakupki@127.0.0.1:5432/zakupki?sslmode=disable
    volumes:
      - ${TENDERS_HOST_PATH:-tenders_data}:/data/tenders
      # правки чек-листов/промптов без пересборки образа:
      - ./configs:/app/configs:ro

volumes:
  pgdata:
  tenders_data:
