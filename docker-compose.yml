# Автономный запуск analizator_zakupok (отдельный сервис).
#
# LM Studio на ЭТОЙ же машине (порт 1234):
#   из контейнера → http://host.docker.internal:1234/v1
#   локально go run → http://127.0.0.1:1234/v1 (см. .env.example)
#
# Платформа (zakupki-platform ./up.sh --ai) поднимает этот же образ
# и задаёт core ANALIZATOR_URL=http://analizator:8088.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakupki
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["db"]

  analizator:
    build: .
    ports:
      - "8088:8088"
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      PROMPTS_DIR: /app/configs/prompts
      DEFAULT_CHECKLIST: ${DEFAULT_CHECKLIST:-default}
      # Docker → LM Studio на хосте. Не используйте 127.0.0.1 внутри контейнера.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      LM_STUDIO_TIMEOUT: ${LM_STUDIO_TIMEOUT:-5m}
      CHUNK_SIZE: ${CHUNK_SIZE:-3500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-250}
      MAX_CHUNKS: ${MAX_CHUNKS:-40}
      CONCURRENCY: ${CONCURRENCY:-1}
    volumes:
      - ${TENDERS_HOST_PATH:-tenders_data}:/data/tenders
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  tenders_data:
