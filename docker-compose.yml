# Автономный запуск analizator_zakupok (+ PostgreSQL для раздела analysis).
# LM Studio должен быть доступен с хоста (порт 1234) или через LM_STUDIO_BASE_URL.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakupki
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10

  analizator:
    build: .
    ports:
      - "8088:8088"
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      DEFAULT_CHECKLIST: default
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
      CHUNK_SIZE: "3500"
      CHUNK_OVERLAP: "250"
      MAX_CHUNKS: "40"
      CONCURRENCY: "2"
    volumes:
      - tenders_data:/data/tenders
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  tenders_data:
